    model: jkemqc
    size: 0.06
    position: [1.35, 0.127, 0.890]

  - type: DatasetObject
    name: apple
    category: apple
    model: agveuv
    size: 0.08
    position: [1.24, -0.46, 0.71]

  - type: DatasetObject
    name: baby_bottles
    category: baby_bottle
    model: mzedhe
    size: 0.10
    position: [0.82, 0.38, 0.82]

task:
  type: PointReachingTask
  robot_idn: 0
  floor: 0
  initial_pos: [0, 0, 0]
  initial_quat: [0, 0, 0, 1]
  goal_pos: [0.86, -0.47, 0.75] # Catch Mouse
  goal_tolerance: 0.001  
  goal_in_polar: false
  path_range: [1.0, 10.0]
  height_range: [0, 10]
  visualize_goal: false
  visualize_path: false
  goal_height: 0.06
  waypoint_height: 0.05
  waypoint_width: 0.1
  n_vis_waypoints: 10
  reward_config:
    r_potential: 1.0
    r_collision: 0.1
    r_pointgoal: 10.0
  termination_config:
    max_collisions: 500
    max_steps: 500
    fall_height: 0.03

