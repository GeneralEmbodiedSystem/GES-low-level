# The robot descriptor defines the generalized coordinates and how to map those
# to the underlying URDF dofs.

api_version: 1.0

# Defines the generalized coordinates. Each generalized coordinate is assumed
# to have an entry in the URDF, except when otherwise specified below under
# cspace_urdf_bridge
cspace:
    # - torso_lift_joint
    - arm_left_1_joint
    - arm_left_2_joint
    - arm_left_3_joint
    - arm_left_4_joint
    - arm_left_5_joint
    - arm_left_6_joint
    - arm_left_7_joint

root_link: torso_lift_link
# subtree_root_link: base_footprint

default_q: [
    # Original version
    # 0.00, 0.00, 0.00, -1.57, 0.00, 1.50, 0.75

    # New config
    # 0.03, -1.11479, -0.0685, 1.5696, 1.37304, -0.74273, 1.3983, 1.79618
    -1.11479, -0.0685, 1.5696, 1.37304, -0.74273, 1.3983, 1.79618
]

acceleration_limits: [15.0, 7.5, 10.0, 12.5, 15.0, 20.0, 20.0]
# limit of rate of acceleration change
jerk_limits: [
  7500.0, 3750.0, 5000.0, 6250.0, 7500.0, 10000.0, 10000.0
  ]

# Most dimensions of the cspace have a direct corresponding element
# in the URDF. This list of rules defines how unspecified coordinates
# should be extracted.
cspace_to_urdf_rules:
#    - {name: wheel_left_joint, rule: fixed, value: 0.0 }
#    - {name: wheel_right_joint, rule: fixed, value: 0.0 }
    - {name: head_1_joint, rule: fixed, value: 0.0}
    - {name: head_2_joint, rule: fixed, value: 0.0}
    - {name: gripper_left_left_finger_joint, rule: fixed, value: 0.05}
    - {name: gripper_left_right_finger_joint, rule: fixed, value: 0.05}
    - {name: gripper_right_left_finger_joint, rule: fixed, value: 0.05}
    - {name: gripper_right_right_finger_joint, rule: fixed, value: 0.05}

composite_task_spaces: []

# Just using dummy spheres for now for debugging
# Related to collision avoidance, but irrelevent
# to visialization
collision_spheres:
    # - torso_lift_joint:
    #     - "center": [0.0, 0.0, 0.0]
    #       "radius": 0.001
    - arm_left_1_link:
        - "center": [0.03148, -0.03091, 0.03038]
          "radius": 0.08
    - arm_left_2_link:
        - "center": [0.007, -0.02106, -0.007]
          "radius": 0.06
    - arm_left_3_link:
        - "center": [-0.0021, -0.01675, 0]
          "radius": 0.06
        - "center": -0.00289, -0.10222, 0.002]
          "radius": 0.06
    - arm_left_4_link:
        - "center": [0.03717, 0.00846, 0.0199]
          "radius": 0.08
        - "center": [0.03115, -0.10051, 0.02179]
          "radius": 0.06
    - arm_left_5_link:
        - "center": [0.00108, -0.03009, 0.00873]
          "radius": 0.06
    - arm_left_6_link:
        - "center": [ -48281, 0.03866, 0.00795]
          "radius": 0.06
    - arm_left_7_link:
        - "center": [ 0.01682, -0.07186, 0.01862]
          "radius": 0.07
    # - gripper_left_link:
    #     - "center": [ 0.06061, 0.64627, 0.3038 ]
    #       "radius": 0.5
