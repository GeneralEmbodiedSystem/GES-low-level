scene_cfg:
  type: InteractiveTraversableScene
  scene_model: Beechwood_0_int
  load_object_categories:  # this line means load_mode == "Quick". Comment it if you want to load all objects
    - floors
    - walls
    - ceilings

robot0_cfg:
  type: TiagoAdvanced  # or FetchAdanced sth.
  obs_modalities:
    - scan
    - rgb
    - depth
  action_type: continuous
  action_normalize: true
  grasping_mode: sticky  # or physical
  position: [-4.0, 0.0, 0.0]

objects_cfg:
  - type: DatasetObject
    name: delicious_apple
    category: apple
    model: agveuv
    size: 0.07
    position: [0.83, -0.1, 0.97]

  - type: DatasetObject
    name: alarm_clock
    category: alarm_clock
    model: cvknrh
    size: 0.06
    position: [1.53, 0.1, 0.97]

  - type: DatasetObject
    name: water_bottle
    category: water_bottle
    model: ackxiy
    size: 0.06
    position: [1.33, -0.5, 0.97]

  - type: LightObject
    name: brilliant_light
    light_type: Sphere
    intensity: 50000
    radius: 0.1
    position: [3.0, 3.0, 4.0]

  - type: DatasetObject
    name: table
    category: breakfast_table
    model: lcsizg
    bounding_box: [0.5, 0.5, 0.8]
    fit_avg_dim_volume: false
    fixed_base: true
    position: [0.7, -0.1, 0.6]
    orientation: [0, 0, 0.707, 0.707]

  - type: DatasetObject
    name: chair
    category: straight_chair
    model: amgwaw
    bounding_box: null
    fit_avg_dim_volume: true
    fixed_base: false
    position: [-0.45, 0.65, 0.425]
    orientation: [0, 0, -0.9990215, -0.0442276]

  - type: PrimitiveObject
    name: box
    primitive_type: Cube
    rgba: [1.0, 0, 0, 1.0]
    size: 0.05
    position: [0.53, -0.1, 0.97]
