# env description: I am in front of a conference table, and there are a laptop, a mousepad, a mouse... robot needs to help me put the cup and the box of yogurt on the coffee table to the left of the laptop
scene_cfg:
  type: InteractiveTraversableScene
  scene_model: Beechwood_0_int
  load_object_categories:  # this line means load_mode == "Quick". Comment it if you want to load all objects
    - floors
    - walls
    - ceilings

robot0_cfg:
  type: TiagoAdvanced  # or FetchAdanced sth.
  obs_modalities:
    - scan
    - rgb
    - depth
  action_type: continuous
  action_normalize: true
  self_collisions: false
  prim_path': "/World/robot"
  fixed_base: false
  grasping_mode: sticky  # or physical
  controller_config:
      camera:
        name: JointController
        motor_type: position
      base:
        name: JointController
        motor_type: velocity
      arm_left: 
        name: JointController
        motor_type: position
      arm_right: 
        name: JointController
        motor_type: position

other_init_cfg:
  robot_position: [0.0, -0.5, 0.0]  # do not move this line to robot0_cfg, it is not a robot property and will cause error (will be changed by og.env)
  robot_orientation: [0, 0, 0.707, 0.707]  # do not move this line to robot0_cfg, it is not a robot property and will cause error (will be changed by og.env)
  camera_resolution:
    image_height: 720
    image_width: 720

viewer_camera_cfg:
  position: [1.66024,  1.49093,  2.30134]
  orientation: [0.17299,  0.40222,  0.82587, 0.35529]  # note that it is (x, y, z, w) instead of (w, x, y, z)

objects_cfg:
  # working desk
  - type: DatasetObject
    name: conference_table
    category: conference_table
    model: jxixdw
    fit_avg_dim_volume: false
    fixed_base: true
    position: [1.117, -0.1, 0.69]

  # - type: DatasetObject
  #   name: alarm_clock
  #   category: alarm_clock
  #   model: cvknrh
  #   size: 0.06
  #   position: [1.17, 0.52, 0.870]

  - type: DatasetObject
    name: laptop
    category: laptop
    model: izydvb
    size: 0.06
    fixed_base: false
    position: [1.0, -0.0, 0.95]
    orientation: [0, 0, 1, 0]  # rotate 180 degree around z axis

  - type: DatasetObject
    name: mousepad
    category: mousepad
    model: mfrcto
    size: 0.06
    position: [0.86, -0.47, 0.72]
    orientation: [0, 0, -0.707, -0.707]
    
  - type: DatasetObject
    name: mouse
    category: mouse
    model: cduwda
    size: 0.06
    position: [0.86, -0.47, 0.75]
    orientation: [0, 0, -0.707, 0.707]  # clockwise rotate 90 degree around z axis
    # [0, 0, 0.707, 0.707] means anti-clockwise rotate 90 degree around z axis

  - type: DatasetObject
    name: boxed_cpu_board
    category: boxed_cpu_board
    model: xlqvil
    size: 0.06
    position: [1.17, 0.678, 0.870]

  - type: DatasetObject
    name: electric_fan
    category: electric_fan
    model: qqphyr
    position: [0.83, 1.25, 0.37]

  # food
  - type: DatasetObject
    name: coffee_table
    category: coffee_table
    model: aoojzy
    fixed_base: true
    fit_avg_dim_volume: false
    position: [-0.5, 1.3, 0.37]

  - type: DatasetObject
    name: cup
    category: cup
    model: lfxtqa
    size: 0.04
    fixed_base: false
    position: [-0.22, 1.1, 0.476]
    orientation: [0.707, 0, 0, 0.707]  # anti-clockwise rotate 90 degree around x axis

  - type: DatasetObject
    name: box_of_yogurt
    category: box_of_yogurt
    model: jkemqc
    # size: 0.06
    bounding_box: [0.06, 0.06, 0.08]
    position: [-0.6, 1.10, 0.47]

